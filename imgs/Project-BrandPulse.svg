<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">BrandPulse social sentiment ETL pipeline</title>
  <desc id="desc">A diagram showing social sources flowing through an Airflow pipeline into sentiment analytics and Power BI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g opacity=".08" stroke="#fff">
    <path d="M0 75h1200M0 150h1200M0 225h1200M0 300h1200M0 375h1200M0 450h1200M0 525h1200M0 600h1200"/>
    <path d="M100 0v675M200 0v675M300 0v675M400 0v675M500 0v675M600 0v675M700 0v675M800 0v675M900 0v675M1000 0v675M1100 0v675"/>
  </g>
  <text x="72" y="88" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">BrandPulse</text>
  <text x="72" y="124" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="20">Multi-source social sentiment ETL framework</text>
  <g filter="url(#shadow)">
    <rect x="70" y="220" width="230" height="240" rx="24" fill="#111827" stroke="#334155"/>
    <rect x="410" y="220" width="380" height="240" rx="24" fill="#111827" stroke="#334155"/>
    <rect x="900" y="220" width="230" height="240" rx="24" fill="#111827" stroke="#334155"/>
  </g>
  <text x="185" y="270" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">SOCIAL SOURCES</text>
  <circle cx="140" cy="345" r="42" fill="#ff4500"/>
  <text x="140" y="356" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="31" font-weight="700">r/</text>
  <circle cx="230" cy="345" r="42" fill="#0f172a" stroke="#64748b"/>
  <text x="230" y="356" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">X</text>
  <text x="600" y="270" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">AIRFLOW ETL PIPELINE</text>
  <g fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round">
    <path d="M470 340h90"/>
    <path d="M640 340h90"/>
  </g>
  <g fill="#1e293b" stroke="#38bdf8" stroke-width="2">
    <rect x="448" y="310" width="92" height="60" rx="12"/>
    <rect x="554" y="310" width="92" height="60" rx="12"/>
    <rect x="660" y="310" width="92" height="60" rx="12"/>
  </g>
  <text x="494" y="346" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="16">Extract</text>
  <text x="600" y="346" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="16">Transform</text>
  <text x="706" y="346" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="16">Load</text>
  <text x="600" y="410" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">Sentiment scoring · Supabase · JSON</text>
  <text x="1015" y="270" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">POWER BI</text>
  <g transform="translate(955 310)">
    <rect width="120" height="94" rx="12" fill="#facc15"/>
    <rect x="24" y="48" width="14" height="25" rx="3" fill="#0f172a"/>
    <rect x="53" y="32" width="14" height="41" rx="3" fill="#0f172a"/>
    <rect x="82" y="17" width="14" height="56" rx="3" fill="#0f172a"/>
  </g>
  <g fill="none" stroke="#60a5fa" stroke-width="4" stroke-dasharray="10 10">
    <path d="M300 340h110"/>
    <path d="M790 340h110"/>
  </g>
  <text x="600" y="560" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="24">From raw social commentary to decision-ready brand intelligence</text>
</svg>
